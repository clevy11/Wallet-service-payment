server:
  port: 8081

spring:
  application:
    name: wallet-service

  datasource:

    url: jdbc:postgresql://localhost:5433/walletdb
    username: postgres
    password: postgres

  jpa:
    # validate, never update/create. Flyway owns the schema; Hibernate only checks
    # that its mappings agree with it and refuses to boot on a mismatch. `update`
    # would silently ALTER tables with no record of what it changed; `create` would
    # drop data on every boot.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # JacksonJsonSerializer, NOT JsonSerializer. Boot 4 ships Jackson 3
      # (tools.jackson) and configures that ObjectMapper; the older JsonSerializer is
      # Jackson 2 (com.fasterxml) and never sees the application's mapper.
      #
      # The producer block is not optional just because this service also consumes:
      # without it Boot falls back to StringSerializer, and every publish fails at
      # runtime with a SerializationException naming the envelope class. Nothing fails
      # at boot, the outbox row just retries forever.
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # No __TypeId__ header. Consumers are configured to ignore type headers and use
        # their own envelope type; sending one would put this service's class names on
        # the wire and couple every consumer to this package layout.
        spring.json.add.type.headers: false
        acks: all
        # A retry of the same send is deduplicated at the broker by producer id and
        # sequence, so a network timeout does not become a duplicate event.
        enable.idempotence: true
        retries: 3
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    listener:
      # RECORD, not BATCH: the offset advances after each listener call returns, so a
      # crash before the @Transactional method commits means the offset was never
      # advanced and the event is redelivered. BATCH would also commit on its own
      # schedule and can acknowledge records this consumer has not durably stored.
      #
      # Paired with enable-auto-commit: false below -- with auto-commit on, the
      # consumer's position advances in the background regardless of what the handler
      # did, which silently drops events on any crash.
      ack-mode: record
    consumer:
      # Auto-commit would advance the offset before the listener has finished, so a
      # crash mid-handler silently drops the event. Everything is committed
      # manually after the database transaction succeeds.
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # JacksonJsonDeserializer, NOT JsonDeserializer: the unprefixed one is still
      # Jackson 2 under Boot 4, while the application and the producer both use
      # Jackson 3. The payload would arrive as an unparsed map.
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.walletservice.events
        # One concrete envelope type for the whole topic. The payload stays a
        # JsonNode because its real type is only knowable from eventType at
        # runtime -- see EventEnvelope.
        spring.json.value.default.type: com.example.walletservice.events.EventEnvelope
        # Ignore any __TypeId__ header and use the configured type instead. The
        # producer is configured not to send one; if a future version did, obeying
        # it would make this service resolve the producer's class names.
        spring.json.use.type.headers: false

app:
  events:
    # Consuming a service's topic is a contract with the producer, not a per-event
    # subscription: one topic, many event types, filtered by eventType in code.
    auth-topic: auth.events
    # Where wallet-service publishes its own events. A different topic from
    # auth.events so that wallet-service's consumers can be granted read access
    # without also being able to read the auth domain's.
    wallet-topic: wallet.events

  security:
    # Base URL of the service that signs tokens. The decoder appends
    # /.well-known/jwks.json to fetch the signing key, and separately requires the
    # `iss` claim to equal this value, so a token from any other issuer is refused.
    #
    # A config value, not a service registry lookup: there is no discovery in this
    # system, and an address that changes at runtime is one more thing to be right
    # about before anything works.
    auth-server-issuer: http://localhost:8090
    # Tokens are minted with this audience. Checked on every request, so a token
    # issued for another service cannot be replayed here.
    audience: wallet-service

  outbox:
    # How often the relay looks for unpublished rows.
    fixed-delay-ms: 2000
    # Wait this long before the first scan. Without it every replica started at the
    # same moment scans the same backlog in lockstep -- worst right after a restart,
    # which is when the backlog is largest.
    initial-delay-ms: 2000
    batch-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
