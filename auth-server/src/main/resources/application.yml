server:
  port: 8090

spring:
  application:
    name: auth-server

  datasource:
    # Host port 5433, not 5432: a leftover process from a previous Docker install
    # already listens on 5432. authdb is created by the Postgres init script.
    url: jdbc:postgresql://localhost:5433/authdb
    username: postgres
    password: postgres

  jpa:
    # validate, never update/create. Flyway owns the schema.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # JacksonJsonSerializer, NOT JsonSerializer. Boot 4 ships Jackson 3
      # (tools.jackson) and configures that ObjectMapper; the older JsonSerializer
      # is Jackson 2 (com.fasterxml) and will not see the application's mapper.
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:

        spring.json.add.type.headers: false

        acks: all
        # Makes a retry of the same send idempotent at the broker: a duplicate
        # caused by a network timeout is deduplicated by producer id and sequence.
        enable.idempotence: true
        retries: 3
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000

app:
  security:
    # Who the tokens say they are from. A verifier is expected to check this, or a
    # token from some other issuer that happens to be signed by a key it trusts
    # would be accepted.
    issuer: http://localhost:8090
    # 15 minutes. Short enough that a leaked token's usefulness is bounded, long
    # enough that a page of requests does not each need a fresh login. There are no
    # refresh tokens yet, so at worst the user logs in again after this.
    token-ttl: 15m
    # Where the signing keypair lives. Generated on first boot, then reused -- a new
    # keypair per restart would invalidate every token already in flight and silently
    # log out every user on each deploy. Never commit this directory.
    key-directory: ./keys
  events:
    # One topic per producing service, not per event type. A new event type then
    # needs no change to any consumer's subscription config.
    auth-topic: auth.events
  outbox:
    # How often the relay looks for unpublished rows.
    fixed-delay-ms: 2000
    # Wait this long before the first scan. Without it, every replica started at the
    # same moment scans the same backlog in lockstep -- worst exactly after a
    # restart, which is when the backlog is largest.
    initial-delay-ms: 2000
    batch-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true