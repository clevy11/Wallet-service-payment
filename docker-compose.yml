# Local infrastructure for the wallet-system modules.
#
# Default (`docker compose up -d`) starts Postgres only. Kafka sits behind the
# `kafka` profile because it is only needed from Day 3 onwards, and this machine
# has 8.3 GB allocated to Docker:
#
#   docker compose up -d                        # postgres
#   docker compose --profile kafka up -d        # postgres + kafka
#   docker compose --profile observability up -d # + prometheus, grafana, jaeger
#   docker compose --profile security up -d      # + keycloak
#
# Every service address here is injected as a plain config value -- there is no
# service discovery anywhere in this system (see AGENTS.md).

services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # The container
      # always speaks 5432 internally; only the host-side mapping differs, so
      # application.yml points at localhost:5433.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Only executed on first initialisation of an empty data directory.
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    container_name: wallet-kafka
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft: this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # What clients are told to use. localhost works for services running on the
      # host; containers on this network would use kafka:9092 instead.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single broker, so every internal topic must allow replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data: